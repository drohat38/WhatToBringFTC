<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:20px;background:#b0c0d0;font-family:sans-serif;}
canvas{display:block;margin:20px auto;box-shadow:0 10px 50px rgba(0,0,0,0.25);}
h2{text-align:center;font-family:sans-serif;margin:20px 0 4px;color:#222;}
</style>
</head>
<body>
<h2>Grocery List Card (final)</h2>
<canvas id="c1"></canvas>
<h2>Impact Card — 50% preview</h2>
<canvas id="c2"></canvas>
<script>
var GOAL=30,CHIPS=3,TANGERINES=3;
var LOGS=[{meals:30,date:'6/1/2025',chapter:'Denton, TX'},{meals:25,date:'5/4/2025',chapter:'Denton, TX'},{meals:45,date:'4/6/2025',chapter:'Denton, TX'}];
function calcItems(g){return{bread:Math.ceil(g/10),meatOz:g*2,cheese:g,mustard:Math.ceil(g/50),bags:Math.ceil(g/50),chips:CHIPS,tangerines:TANGERINES};}
var P={orange:'#FF6500',navy:'#003366',blue:'#3BAEE8',bluePale:'#E6F4FC',white:'#FFFFFF',offW:'#F8FAFC',border:'#E2E8F0',muted:'#7A8FA6',text:'#0F1F35'};
function pill(ctx,x,y,w,h,r,fill){
  ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();ctx.fill();
}
function wrapText(ctx,text,x,y,maxW,lineH){
  var words=text.split(' '),line='';
  for(var i=0;i<words.length;i++){var test=line+words[i]+' ';if(ctx.measureText(test).width>maxW&&i>0){ctx.fillText(line.trim(),x,y);line=words[i]+' ';y+=lineH;}else line=test;}
  if(line.trim())ctx.fillText(line.trim(),x,y);
}

// ════════════════════════════════════════════
//  GROCERY LIST CARD  — FINAL
// ════════════════════════════════════════════
function buildCanvas(){
  var g=GOAL,c=calcItems(g),DPR=2,W=900,PAD=60;
  var mainRows=[
    {e:'🍞',n:'SLICED BREAD',  q:c.bread,  u:c.bread===1  ?'LOAF':'LOAVES'  },
    {e:'🥩',n:'DELI MEAT',     q:c.meatOz, u:'OZ TOTAL'                     },
    {e:'🧀',n:'SLICED CHEESE', q:c.cheese, u:c.cheese===1 ?'SLICE':'SLICES' },
    {e:'🍯',n:'YELLOW MUSTARD',q:c.mustard,u:c.mustard===1?'BOTTLE':'BOTTLES'},
    {e:'🛍',n:'SANDWICH BAGS', q:c.bags,   u:c.bags===1   ?'BOX':'BOXES'    }
  ];
  var snackRows=[];
  if(c.chips>0)      snackRows.push({e:'🥔',n:'CHIPS',      q:c.chips,      u:c.chips===1      ?'BAG':'BAGS'});
  if(c.tangerines>0) snackRows.push({e:'🍊',n:'TANGERINES', q:c.tangerines, u:c.tangerines===1 ?'BAG':'BAGS'});
  var hasSnacks=snackRows.length>0;
  var HEADER_H=224,ROW_H=74,SEC_H=44,SEC_GAP=20,BODY_PAD=46,FOOTER_H=80;
  var bodyH=BODY_PAD+SEC_H+mainRows.length*ROW_H+(hasSnacks?SEC_GAP+SEC_H+snackRows.length*ROW_H:0)+BODY_PAD;
  var H=HEADER_H+bodyH+FOOTER_H;
  var cv=document.getElementById('c1');
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  var ctx=cv.getContext('2d');ctx.scale(DPR,DPR);

  /* White base */
  ctx.fillStyle=P.white;ctx.fillRect(0,0,W,H);

  /* Orange header with angled bottom */
  ctx.fillStyle=P.orange;ctx.beginPath();
  ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W,HEADER_H-40);ctx.lineTo(0,HEADER_H);
  ctx.closePath();ctx.fill();

  /* Sky-blue accent wedge, top-right */
  ctx.save();ctx.globalAlpha=0.25;ctx.fillStyle=P.blue;
  ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(W,HEADER_H-40);ctx.lineTo(W*0.64,0);
  ctx.closePath();ctx.fill();ctx.restore();

  /* Very subtle diagonal highlight lines */
  ctx.save();ctx.strokeStyle='rgba(255,255,255,0.09)';ctx.lineWidth=30;
  for(var xi=60;xi<W;xi+=260){ctx.beginPath();ctx.moveTo(xi-HEADER_H,0);ctx.lineTo(xi+HEADER_H,HEADER_H);ctx.stroke();}
  ctx.restore();

  /* Brand line */
  ctx.fillStyle='rgba(255,255,255,0.58)';ctx.font='700 10px "Open Sans"';ctx.textAlign='left';
  ctx.fillText('FEED THE CITY  ·  TANGOCHARITIES.ORG',PAD,36);

  /* Hero number + unit */
  ctx.fillStyle=P.white;ctx.font='bold 122px Anton';ctx.textAlign='left';
  var numStr=String(g),numW=ctx.measureText(numStr).width;
  ctx.fillText(numStr,PAD,178);
  ctx.font='bold 44px Anton';
  ctx.fillText(g===1?' SANDWICH':' SANDWICHES',PAD+numW+4,178);

  /* Sub-caption */
  ctx.fillStyle='rgba(255,255,255,0.52)';ctx.font='600 11px "Open Sans"';
  ctx.fillText('Supplies to bring to your Feed the City event',PAD,208);

  /* Body rows */
  var y=HEADER_H+BODY_PAD,rowIdx=0;
  function secLabel(lbl){
    ctx.fillStyle=P.blue;ctx.font='800 9px "Open Sans"';ctx.textAlign='left';ctx.fillText(lbl,PAD,y+5);
    ctx.strokeStyle=P.border;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(PAD+108,y+1);ctx.lineTo(W-PAD,y+1);ctx.stroke();
    y+=SEC_H;rowIdx=0;
  }
  function itemRow(row){
    var top=y,mid=top+ROW_H/2;
    if(rowIdx%2===0){ctx.fillStyle=P.offW;ctx.fillRect(0,top,W,ROW_H);}
    ctx.fillStyle=rowIdx%2===0?P.orange:P.blue;ctx.fillRect(0,top,3,ROW_H);
    ctx.font='21px serif';ctx.textAlign='left';ctx.fillText(row.e,PAD,mid+8);
    ctx.fillStyle=P.text;ctx.font='bold 13px Anton';ctx.textAlign='left';ctx.fillText(row.n,PAD+38,mid+5);
    ctx.fillStyle=P.orange;ctx.font='bold 42px Anton';ctx.textAlign='right';ctx.fillText(String(row.q),W-PAD-76,mid+15);
    ctx.fillStyle=P.muted;ctx.font='700 8px "Open Sans"';ctx.textAlign='left';ctx.fillText(row.u,W-PAD-68,mid+4);
    ctx.strokeStyle=P.border;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(PAD,top+ROW_H);ctx.lineTo(W-PAD,top+ROW_H);ctx.stroke();
    y+=ROW_H;rowIdx++;
  }
  secLabel('SANDWICH SUPPLIES');mainRows.forEach(itemRow);
  if(hasSnacks){y+=SEC_GAP;secLabel('SNACK ITEMS');snackRows.forEach(itemRow);}

  /* Footer */
  var fy=H-FOOTER_H;
  ctx.fillStyle=P.navy;ctx.fillRect(0,fy,W,FOOTER_H);
  ctx.fillStyle=P.orange;ctx.fillRect(0,fy,W,3);
  ctx.fillStyle=P.white;ctx.font='bold 17px Anton';ctx.textAlign='left';ctx.fillText('TANGOCHARITIES.ORG',PAD,fy+30);
  ctx.fillStyle='rgba(255,255,255,0.36)';ctx.font='600 10px "Open Sans"';ctx.fillText('Feed the City  ·  Thank you for showing up.',PAD,fy+52);
}

// ════════════════════════════════════════════
//  IMPACT CARD  — FINAL
// ════════════════════════════════════════════
function buildImpactCanvas(){
  var logs=LOGS,total=logs.reduce(function(s,e){return s+e.meals;},0);
  var events=logs.length,city=logs.length?logs[logs.length-1].chapter.split(',')[0]:'Your City';
  var DPR=2,W=1080,H=1350;
  var msLabel,msDesc;
  if(total>=500){msLabel='500 MEAL MILESTONE';msDesc='Five hundred meals. Your commitment to this community is extraordinary.';}
  else if(total>=250){msLabel='250 MEAL MILESTONE';msDesc="You've helped feed 250 people. That's the power of showing up.";}
  else if(total>=100){msLabel='100 MEAL MILESTONE';msDesc='One hundred people ate because of what you brought.';}
  else if(total>=25){msLabel='FIRST CONTRIBUTION';msDesc="You're making a real difference. Keep showing up.";}
  else{msLabel='COMMUNITY VOLUNTEER';msDesc='Every sandwich you pack goes directly to a family in your community.';}

  var cv=document.getElementById('c2');
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=Math.round(W*0.48)+'px';cv.style.height=Math.round(H*0.48)+'px';
  var ctx=cv.getContext('2d');ctx.scale(DPR,DPR);

  /* White base */
  ctx.fillStyle=P.white;ctx.fillRect(0,0,W,H);

  /* Background geometry: large pale-blue circle, bottom-right anchor */
  ctx.save();ctx.fillStyle=P.bluePale;
  ctx.beginPath();ctx.arc(W*0.88,H*0.77,580,0,Math.PI*2);ctx.fill();ctx.restore();

  /* Background geometry: pale orange arc, top-left */
  ctx.save();ctx.globalAlpha=0.10;ctx.fillStyle=P.orange;
  ctx.beginPath();ctx.arc(-60,-60,360,0,Math.PI*2);ctx.fill();ctx.restore();

  /* Top orange strip */
  ctx.fillStyle=P.orange;ctx.fillRect(0,0,W,6);

  /* ── Header ── */
  ctx.textAlign='center';
  ctx.fillStyle=P.orange;ctx.font='bold 28px Anton';ctx.fillText('FEED THE CITY',W/2,68);
  ctx.fillStyle=P.muted;ctx.font='600 12px "Open Sans"';ctx.fillText('VOLUNTEER IMPACT  ·  TANGOCHARITIES.ORG',W/2,92);

  /* City badge */
  var cTxt=city.toUpperCase();ctx.font='800 15px "Open Sans"';
  var cW=ctx.measureText(cTxt).width+52,cH=40,cX=W/2-cW/2,cY=108;
  pill(ctx,cX,cY,cW,cH,20,P.navy);
  ctx.fillStyle=P.white;ctx.font='800 15px "Open Sans"';ctx.textAlign='center';ctx.fillText(cTxt,W/2,cY+26);

  /* Separator */
  ctx.strokeStyle=P.border;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W*0.12,168);ctx.lineTo(W*0.88,168);ctx.stroke();

  /* ── Concentric ring decoration behind hero ── */
  ctx.save();ctx.strokeStyle=P.blue;ctx.lineWidth=2;ctx.globalAlpha=0.22;
  ctx.beginPath();ctx.arc(W/2,592,348,0,Math.PI*2);ctx.stroke();ctx.restore();
  ctx.save();ctx.strokeStyle=P.orange;ctx.lineWidth=1.5;ctx.globalAlpha=0.16;
  ctx.beginPath();ctx.arc(W/2,592,268,0,Math.PI*2);ctx.stroke();ctx.restore();
  /* dot on top of outer ring */
  ctx.save();ctx.fillStyle=P.orange;ctx.globalAlpha=0.65;
  ctx.beginPath();ctx.arc(W/2,592-348,7,0,Math.PI*2);ctx.fill();ctx.restore();

  /* ── Hero number ── */
  var totalStr=String(total||0);
  var heroSize=totalStr.length>=5?200:totalStr.length>=4?252:totalStr.length>=3?312:378;
  ctx.fillStyle=P.orange;ctx.font='bold '+heroSize+'px Anton';ctx.textAlign='center';
  ctx.shadowColor='rgba(255,101,0,0.14)';ctx.shadowBlur=55;
  ctx.fillText(totalStr,W/2,700);
  ctx.shadowBlur=0;

  ctx.fillStyle=P.navy;ctx.font='bold 74px Anton';ctx.fillText('MEALS',W/2,792);
  ctx.fillStyle=P.muted;ctx.font='600 19px "Open Sans"';
  ctx.fillText('contributed across '+events+(events===1?' event':' events'),W/2,832);

  /* Divider with dots */
  ctx.strokeStyle=P.border;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W*0.1,866);ctx.lineTo(W/2-28,866);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2+28,866);ctx.lineTo(W*0.9,866);ctx.stroke();
  ctx.fillStyle=P.orange;
  [-16,0,16].forEach(function(dx){ctx.beginPath();ctx.arc(W/2+dx,866,4.5,0,Math.PI*2);ctx.fill();});

  /* Milestone pill */
  var mW=460,mH=56,mX=W/2-mW/2,mY=892,mR=28;
  pill(ctx,mX,mY,mW,mH,mR,P.orange);
  ctx.fillStyle=P.white;ctx.font='bold 22px Anton';ctx.textAlign='center';ctx.fillText(msLabel,W/2,mY+37);

  /* Description */
  ctx.fillStyle=P.muted;ctx.font='italic 600 18px "Open Sans"';ctx.textAlign='center';
  wrapText(ctx,msDesc,W/2,982,820,33);

  /* Stats trio */
  var sY=1102;
  ctx.strokeStyle=P.border;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W*0.1,sY-22);ctx.lineTo(W*0.9,sY-22);ctx.stroke();
  [{val:String(total||0),lbl:'TOTAL MEALS',x:W/2-222},
   {val:String(events),  lbl:'EVENTS',      x:W/2    },
   {val:city,            lbl:'HOME CHAPTER',x:W/2+222}
  ].forEach(function(st,i){
    if(i>0){ctx.strokeStyle='rgba(0,51,102,0.09)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(st.x-111,sY-4);ctx.lineTo(st.x-111,sY+62);ctx.stroke();}
    ctx.fillStyle=P.orange;ctx.font='bold 30px Anton';ctx.textAlign='center';ctx.fillText(st.val,st.x,sY+26);
    ctx.fillStyle=P.muted;ctx.font='700 10px "Open Sans"';ctx.fillText(st.lbl,st.x,sY+50);
  });
  ctx.strokeStyle=P.border;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W*0.1,sY+66);ctx.lineTo(W*0.9,sY+66);ctx.stroke();

  /* Footer */
  ctx.fillStyle=P.navy;ctx.fillRect(0,H-170,W,170);
  ctx.fillStyle=P.orange;ctx.fillRect(0,H-170,W,4);
  ctx.fillStyle=P.white;ctx.font='bold 30px Anton';ctx.textAlign='center';ctx.fillText('TANGOCHARITIES.ORG',W/2,H-106);
  ctx.fillStyle='rgba(255,255,255,0.38)';ctx.font='600 15px "Open Sans"';ctx.fillText('Thank you for showing up, month after month.',W/2,H-74);
  ctx.fillStyle='rgba(255,255,255,0.22)';ctx.font='600 12px "Open Sans"';ctx.fillText('A Tango Charities initiative',W/2,H-50);
}

window.addEventListener('load',function(){buildCanvas();buildImpactCanvas();});
</script>
</body>
</html>
