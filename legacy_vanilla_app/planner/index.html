<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed the City — Volunteer Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>


<!-- Sticky header -->
<header id="site-header">
  <span class="brand">FEED THE CITY</span>

  <!-- Locked city badge (shown when ?chapter= param present) -->
  <div id="city-badge" class="city-badge hidden"></div>

  <!-- City picker (shown when no ?chapter= param) -->
  <div id="city-picker-wrap" class="city-picker-wrap hidden">
    <select id="city-select" aria-label="Select your city"></select>
    <div id="city-custom" class="city-custom">
      <button type="button" id="city-trigger" class="city-trigger" onclick="openCityPicker()">
        <span id="city-label">Select city…</span>
        <svg width="10" height="10" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div id="city-dropdown" class="city-dropdown" role="listbox" aria-label="City options">
        <input type="text" id="city-search" class="city-search" placeholder="Search city…"
               oninput="filterCities(this.value)" autocomplete="off">
        <ul id="city-options" class="city-options"></ul>
      </div>
    </div>
  </div>
</header>

<!-- ── GOAL ZONE ── -->
<section id="goal-zone" aria-label="Sandwich goal">
  <h1 class="goal-heading">HOW MANY<br>SANDWICHES?</h1>

  <div class="stepper" role="group" aria-label="Adjust sandwich count">
    <button class="step-btn" onclick="stepGoal(-5)" aria-label="Decrease by 5">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="goal-num-wrap">
      <span id="goal-display" class="goal-num" aria-live="polite" aria-atomic="true">30</span>
      <span class="g-unit">Sandwiches</span>
    </div>
    <button class="step-btn" onclick="stepGoal(5)" aria-label="Increase by 5">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <p id="goal-hint" class="goal-hint">Enough to feed ~15 families</p>
</section>

<!-- ── INGREDIENT LIST ── -->
<section id="ingredients-zone" aria-label="What to bring">
  <div class="sec-hd"><p class="sec-ttl">Sandwich Supplies</p><div class="sec-rule"></div></div>
  <div class="ig ig-5" id="ing-list" role="list"></div>

  <div class="sec-hd sec-hd--minor"><p class="sec-ttl">Snack Items</p><div class="sec-rule"></div></div>
  <div class="ig ig-2" id="also-list" role="list"></div>
</section>

<!-- ── ACTION BUTTONS ── -->
<section id="actions-zone" aria-label="Export options">
  <button class="btn-outline" id="btn-copy" onclick="handleCopy()">
    📋 COPY LIST
  </button>
  <button class="btn-outline" id="btn-save" onclick="handleSave()">
    ⬇ SAVE IMAGE
  </button>
</section>

<!-- ── LOG CTA ── -->
<section id="log-zone" aria-label="Log your impact">
  <button class="btn-log" id="btn-log" onclick="expandLog()">
    LOG YOUR IMPACT &amp; REGISTER ↓
  </button>

  <div id="log-expand" class="log-expand" aria-hidden="true">
    <div class="email-row">
      <input type="email" id="email-input" class="email-input"
             placeholder="your@email.com" autocomplete="email"
             onkeydown="if(event.key==='Enter') handleSubmit()">
      <button class="btn-submit" onclick="handleSubmit()" aria-label="Submit">→</button>
    </div>
    <p class="email-hint">We'll remember you for next time.</p>
  </div>

  <div id="log-success" class="log-success hidden" role="status">
    ✓ Logged! Scrolling to register…
  </div>
</section>

<!-- ── FOOTER ── -->
<footer class="site-footer">
  <a href="https://tangocharities.org/feed-the-city" target="_blank" rel="noopener noreferrer" class="footer-link">
    Find other Feed the City events →
  </a>
</footer>

<!-- Hidden utilities -->
<input type="number" id="goal-input" hidden min="5" max="500" value="30">
<canvas id="canvas" hidden></canvas>

<script src="../shared/chapters.js"></script>
<script src="script.js"></script>
</body>
</html>
